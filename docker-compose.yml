version: v2
name: my-app

services:
  - name: streaming-service
    type: web
    build:
      method: docker
      context: ./streaming_service
      dockerfile: Dockerfile
    port: 8000
    cpuCores: 0.2
    ramMegabytes: 512
    autoscaling:
      enabled: true
      minInstances: 1
      maxInstances: 3
      memoryThresholdPercent: 70
      cpuThresholdPercent: 70
    env_file:
      - .dev.env
    healthCheck:
      enabled: true
      httpPath: /health

  - name: data-service
    type: web
    build:
      method: docker
      context: ./data_service
      dockerfile: Dockerfile
    port: 8000
    cpuCores: 0.2
    ramMegabytes: 512
    autoscaling:
      enabled: true
      minInstances: 1
      maxInstances: 3
      memoryThresholdPercent: 70
      cpuThresholdPercent: 70
    env_file:
      - .dev.env
    healthCheck:
      enabled: true
      httpPath: /health

  - name: redis
    type: web
    image: redis:latest
    run: redis-server --requirepass redistest123
    private: true
    cpuCores: 0.1
    ramMegabytes: 256
    env_file:
      - .dev.env

predeploy:
  run: echo "Preparing the environment..."

build:
  method: docker
  context: ./
  dockerfile: ./streaming_service/Dockerfile

env:
  APP_ENV: development
